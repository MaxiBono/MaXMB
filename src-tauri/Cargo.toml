[package]
name = "ps3xmb"
version = "1.0.0"
description = "MaXMB"
authors = ["Maxi"]
edition = "2021"
rust-version = "1.77"

# The library crate holds all logic; main.rs is a thin shim that calls run().
# The name here is what main.rs imports: `ps3xmb_lib::run()`.
[lib]
name = "ps3xmb_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` lets the webview load local game art/music/video off disk
# via convertFileSrc (see tauri.conf.json assetProtocol + CSP).
tauri = { version = "2.1", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
imagesize = "0.13"
png = "0.17"
# small copies of photos and song covers for lists and grids (src/thumbs.rs):
# JPEGs decoded already shrunk (DCT scaling), the other kinds through `image`
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate-miniz"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
